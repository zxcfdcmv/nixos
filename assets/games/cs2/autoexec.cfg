// ── crosshair ──────────────────────────────
cl_crosshairstyle "4"
cl_crosshair_length "2"
cl_crosshair_thickness "2"
cl_crosshair_gap "1"
cl_crosshair_drawoutline "0"
cl_crosshair_outlinethickness "0"
cl_crosshair_t "0"
cl_crosshairdot "0"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
cl_crosshairgap_useweaponvalue "0"
cl_crosshair_recoil "0"
cl_crosshaircolor "1"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "165"

// ── Telemetry HUD (网络与帧率监控) ─────────────
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_net_misdelivery_show "2"
cl_hud_telemetry_frametime_show "2"

// ── HUD ─────────────────────────────────────────
hud_scaling "0.8"
cl_hud_color "12"
hud_showtargetid "1"
cl_draw_only_deathnotices "0"
cl_teamid_overhead_mode "2"
cl_teammate_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.75"
r_show_build_info "0"

// ── MOUSE & SENSITIVITY ─────────────────────────
sensitivity "2.10"

// ── VIDEO & PERFORMANCE ──
fps_max "300" // 针对144Hz显示器优化，兼顾延迟与帧率稳定
fps_max_menu "60"
cl_shadow_texture_resolution "1024"

// ── VIEWMODEL (持枪视角) ────────────────────────
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"
viewmodel_presetpos "2"

// ── RADAR (雷达) ────────────────────────────────
cl_radar_always_centered "0"
cl_radar_scale "0.45"
cl_hud_radar_scale "1.3"
cl_radar_rotate "1"
cl_radar_icon_scale_min "0.6"

// ── VOICE & AUDIO (音频优化) ────────────────────
snd_headphone_eq_profile "1" // 0=自然, 1=酥脆(脚步声明显), 2=平滑
snd_spatialize_lerp "0.5" // 空间感与方向感平衡
snd_steamaudio_reverb_level_db "-3" // 降低混响，减少回音误判
voice_always_sample_mic "1" // 解决按键开麦第一句话断音问题

// ── MISC (杂项) ─────────────────────────────────
cl_showfps "0"
cl_showpos "0"
cl_autohelp "0"
cl_showhelp "0"
cl_dm_buyautomatic "0"
mm_dedicated_search_maxping "80"
cl_join_advertise "2"
r_drawtracers_firstperson "0"
rate "786432"
cl_use_opens_buy_menu "0"
cl_silencer_mode "0"
cl_inventory_saved_filter2 "all"
cl_players_link_to_steam_profiles "1"
sv_showimpacts 0

// ── KEY BINDINGS (快捷键绑定) ───────────────────
bind "SPACE" "+jump"
bind "MWHEELDOWN" "+jump"
bind "MWHEELUP" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "g" "drop"
bind "f" "+use"
bind "TAB" "+showscores"
bind "b" "buymenu"
bind "v" "switchhands"
bind "MOUSE5" "+voicerecord"
bind "MOUSE3" "player_ping"
bind "t" "+spray_menu"

// 一键速切
alias +quickknife "slot3"
alias -quickknife "lastinv"
bind "c" "+quickknife"

