// ==========================================
// 1. 定义智能切枪逻辑 (优先主武器，无主武器则副武器)
// ==========================================
alias "equip_gun" "slot2; slot1"

// ==========================================
// 2. 一键丢包 (绑定 C 键)
// ==========================================
alias "+drop_c4" "slot5"
alias "-drop_c4" "drop; equip_gun"
bind "x" "+drop_c4"

// ==========================================
// 3. 一键丢假闪/道具 (绑定 6 键)
// ==========================================
alias "+fakeflash" "slot7" 
alias "-fakeflash" "drop; equip_gun"
bind "6" "+fakeflash"

// ==========================================
// 4. 按住检视道具，松开切枪 (绑定 1-4 键)
// ==========================================
// 1键：高爆手雷 (slot6)
alias "+grenade_he" "slot6; +lookatweapon"
alias "-grenade_he" "-lookatweapon; equip_gun"
bind "1" "+grenade_he"

// 2键：闪光弹 (slot7)
alias "+grenade_flash" "slot7; +lookatweapon"
alias "-grenade_flash" "-lookatweapon; equip_gun"
bind "2" "+grenade_flash"

// 3键：烟雾弹 (slot8)
alias "+grenade_smoke" "slot8; +lookatweapon"
alias "-grenade_smoke" "-lookatweapon; equip_gun"
bind "3" "+grenade_smoke"

// 4键：燃烧瓶 (slot10)
alias "+grenade_molly" "slot10; +lookatweapon"
alias "-grenade_molly" "-lookatweapon; equip_gun"
bind "4" "+grenade_molly"


// 切枪自动检视
bind "MOUSE4" "slot3; +lookatweapon"                // 刀
// bind "1" "slot6; +lookatweapon"                  // 手雷
// bind "2" "slot7; +lookatweapon"                  // 闪光弹
// bind "3" "slot8; +lookatweapon"                  // 烟雾弹
// bind "4" "slot10; +lookatweapon"                 // 燃烧弹
bind "5" "slot5; +lookatweapon"
bind "h" "slot12; +lookatweapon"                 // 医疗针
bind "z" "slot11; +lookatweapon"                 // 电击枪
bind "q" "-lookatweapon; slot1; -lookatweapon"      // 主武器
bind "e" "-lookatweapon; slot2; -lookatweapon"      // 副武器

// 一键跳投
alias +JT "exec jumpthrow;+radialradio3;cl_radialmenu_deadzone_size 0"
alias -JT "-radialradio3"
bind "alt" "+JT" 

// 练习模式飞行
bind "n" "noclip"
alias "pm" "exec practicemode"
alias "pmoff" "exec practicemode_off"

// ── Save settings ───────────────────────────────
host_writeconfig

echo "autoexec.cfg 优化版已成功加载！"
