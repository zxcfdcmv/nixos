mat_bumpmap 1
mat_phong 1
sv_consistency 0

cl_cmdrate 100
cl_updaterate 100
rate 60000
cl_lagcompensation 1
cl_interp_ratio 0
cl_interp 0

mat_monitorgamma_tv_enabled 1
mat_monitorgamma 1.6

net_graph 1
net_graphproportionalfont 0
net_graphshowinterp 0
net_graphshowlatency 0
net_graphpos 1

bind "q" "slot1"
bind "1" "slot3"
bind "2" "slot4"
bind "3" "slot5"
bind "mouse2" "+attack2"
bind "ctrl" "+duck"
bind "i" "show_menu Menu"
bind "r" "+reload;r_cleardecals"
bind "mouse3" "+aim"

bind "x" "go_away_from_keyboard"

bind "," "sm_tank;sm_mvp;sm_health"
bind "F9" "disconnect"
bind "F10" "quit"
bind "F11" "say_team !zs"

alias p3 "cl_interp_ratio 0;cl_interp 0.051;alias p1 p4"
alias p4 "cl_interp_ratio 0;cl_interp 0;alias p1 p3"
alias p1 p3
bind n p1

alias vf1 "cl_viewmodelfovsurvivor 70;bind F6 vf2"
alias vf2 "cl_viewmodelfovsurvivor 95;bind F6 vf3"
alias vf3 "cl_viewmodelfovsurvivor 120;bind F6 vf1"
bind "F6" vf1

alias "shoveshot" "+attack;wait 8;+attack2;wait 8;-attack2;-attack"
bind "MWHEELUP" "shoveshot"

alias "do_melee" "+attack; wait 10; slot1; +attack2; wait 10; -attack2; slot2; -attack; wait 64"
bind "MWHEELDOWN" "do_melee"

